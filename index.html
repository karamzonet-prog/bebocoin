<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebo Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        button:active {
            transform: scale(0.98);
        }
        .wallet-btn {
            background-color: #0ea5e9;
        }
        .score {
            font-size: 32px;
            margin: 20px 0;
            color: #4ade80;
        }
        .wallet-info {
            font-size: 12px;
            color: #94a3b8;
            word-break: break-all;
            margin-top: 10px;
        }
        .leaderboard {
            margin-top: 25px;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
        }
        .leaderboard h3 {
            text-align: center;
            font-size: 16px;
            color: #facc15;
            margin-bottom: 10px;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 5px 0;
            border-bottom: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bebo Game</h1>
        <p id="username">Loading user data...</p>
        
        <div class="score" id="scoreDisplay">0</div>
        <button id="clickBtn">Tap to Increase Score!</button>
        
        <button class="wallet-btn" id="connectWalletBtn">Connect TON Wallet</button>
        <div class="wallet-info" id="walletInfo">Wallet: Not Connected</div>

        <div class="leaderboard">
            <h3>Top Players Leaderboard</h3>
            <div id="lbList">Loading leaderboard...</div>
        </div>
    </div>

    <!-- Firebase and Game Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firestore/database";

        // Your real Firebase project configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCv_3P1hcqpPieCC6_xf-pOrD3cuyQ9nis",
          authDomain: "bebo-4039e.firebaseapp.com",
          projectId: "bebo-4039e",
          storageBucket: "bebo-4039e.firebasestorage.app",
          messagingSenderId: "320695644050",
          appId: "1:320695644050:web:db86b27d512fc977499b4b",
          measurementId: "G-G0B1NJJW69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = "guest_user";
        let userName = "Anonymous Player";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id.toString();
            // إذا اللاعب ما عنده اسم مستعار أو جديد، يظهر بدون اسم حقيقي واضح
            userName = tg.initDataUnsafe.user.first_name ? tg.initDataUnsafe.user.first_name : `Player_${userId.slice(-4)}`;
        } else {
            userName = `Player_${Math.floor(Math.random() * 1000)}`;
        }

        document.getElementById("username").innerText = `Welcome, ${userName}`;

        let score = 0;
        let walletAddress = "";
        const scoreDisplay = document.getElementById("scoreDisplay");
        const clickBtn = document.getElementById("clickBtn");
        const connectWalletBtn = document.getElementById("connectWalletBtn");
        const walletInfo = document.getElementById("walletInfo");
        const lbList = document.getElementById("lbList");

        // Load user data and set initial score to 0 if new
        async function loadUserData() {
            try {
                const userRef = doc(db, "users", userId);
                const docSnap = await getDoc(userRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    score = data.score || 0;
                    walletAddress = data.wallet || "";
                    scoreDisplay.innerText = score;
                    if (walletAddress) {
                        walletInfo.innerText = `Wallet: ${walletAddress.substring(0, 6)}...${walletAddress.substring(walletAddress.length - 4)}`;
                        connectWalletBtn.innerText = "Wallet Connected";
                    }
                } else {
                    // Force start score at 0 for new players
                    score = 0;
                    await setDoc(userRef, {
                        name: userName,
                        score: 0,
                        wallet: "",
                        createdAt: new Date()
                    });
                }
                loadLeaderboard();
            } catch (error) {
                console.error("Error loading user data:", error);
            }
        }

        // Fetch Top Players Leaderboard
        async function loadLeaderboard() {
            try {
                const q = query(collection(db, "users"), orderBy("score", "desc"), limit(5));
                const querySnapshot = await getDocs(q);
                let html = "";
                let rank = 1;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    // Hide name partially or show anonymous if player hasn't interacted/named properly
                    let displayName = data.name ? data.name : "Anonymous";
                    if(displayName.length > 8) displayName = displayName.substring(0, 6) + "..";
                    
                    html += `<div class="lb-item"><span>${rank}. ${displayName}</span> <span><b>${data.score || 0}</b> pts</span></div>`;
                    rank++;
                });
                lbList.innerHTML = html || "No players yet.";
            } catch (error) {
                console.error("Error loading leaderboard:", error);
                lbList.innerHTML = "Leaderboard available soon.";
            }
        }

        loadUserData();

        // Increment score and update database
        clickBtn.addEventListener("click", async () => {
            score += 1;
            scoreDisplay.innerText = score;

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    score: score
                });
                loadLeaderboard(); // Refresh leaderboard on click
            } catch (error) {
                console.error("Error saving score:", error);
            }
        });

        // TON Wallet simulation handler
        connectWalletBtn.addEventListener("click", async () => {
            const simulatedAddress = "UQD_ExampleTonWalletAddress999BeboNetwork"; 
            walletAddress = simulatedAddress;
            
            walletInfo.innerText = `Wallet: ${walletAddress.substring(0, 6)}...${walletAddress.substring(walletAddress.length - 4)}`;
            connectWalletBtn.innerText = "Wallet Connected";

            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    wallet: walletAddress
                });
                alert("Wallet connected successfully!");
            } catch (error) {
                console.error("Error saving wallet address:", error);
            }
        });
    </script>
</body>
</html>
